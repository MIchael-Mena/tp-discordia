<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>Checkpoint 3 · Portada</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --bg-slide: #0b1f2a;
      --bg-canvas: #061118;
      --bg-box: #13303e;
      --bg-node: #0d2430;
      --border-box: #2e4b59;
      --border-divider: #2a5462;
      --cyan: #51d5c8;
      --purple: #987aea;
      --amber: #e2bb70;
      --text-title: #f4f7f9;
      --text-body: #b8cbd6;
      --text-muted: #7897a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1200px;
      height: 675px;
      overflow: hidden;
      background-color: var(--bg-slide);
      color: var(--text-title);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Lienzo 16:9 (1200 x 675) */
    .slide-frame {
      width: 1200px;
      height: 675px;
      background-color: var(--bg-slide);
      padding: 42px 54px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .eyebrow {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 10px;
    }

    .slide-title {
      font-size: 2.65rem;
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--text-title);
      margin-bottom: 10px;
    }

    .slide-title.hu-detail {
      font-size: 2.3rem;
      margin-bottom: 8px;
    }

    .slide-subtitle {
      font-size: 1.12rem;
      color: var(--cyan);
      margin-bottom: 24px;
    }

    /* Layout de 2 columnas (Texto izquierda + Diagrama derecha) */
    .two-col-body {
      display: grid;
      grid-template-columns: 1fr 1.12fr;
      gap: 38px;
      flex: 1;
      min-height: 0;
    }

    /* Layout Slide 1 sin imagen (Ancho completo limpio) */
    .full-width-body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      min-height: 0;
    }

    .hu-grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px 44px;
      margin: auto 0;
    }

    .left-column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hu-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: auto 0;
    }

    .hu-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .hu-item-head {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .purple-bar {
      width: 4px;
      height: 24px;
      background-color: var(--purple);
      border-radius: 2px;
      flex-shrink: 0;
    }

    .hu-item-title {
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--text-title);
    }

    .hu-item-desc {
      padding-left: 16px;
      font-size: 0.94rem;
      line-height: 1.48;
      color: var(--text-body);
    }

    .rules-footer {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 3px solid var(--border-divider);
    }

    .rules-label {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--amber);
      margin-bottom: 4px;
    }

    .rules-text {
      font-size: 0.9rem;
      line-height: 1.42;
      color: var(--text-body);
    }

    /* Contenedor de Diagrama a la derecha */
    .diagram-box {
      background-color: var(--bg-box);
      border: 1.5px solid var(--border-box);
      border-radius: 14px;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .box-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .box-tag.cyan {
      background: rgba(81, 213, 200, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(81, 213, 200, 0.45);
    }

    .box-tag.purple {
      background: rgba(152, 122, 234, 0.18);
      color: #cbb6ff;
      border: 1px solid rgba(152, 122, 234, 0.5);
    }

    .box-tag.amber {
      background: rgba(226, 187, 112, 0.16);
      color: var(--amber);
      border: 1px solid rgba(226, 187, 112, 0.5);
    }

    @media print {
      @page {
        size: 1200px 675px;
        margin: 0;
      }
      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }

    .cover-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
    .cover-title { font-size: 4.2rem; font-weight: 800; line-height: 1.04; letter-spacing: -0.03em; }
    .cover-sub { font-size: 1.3rem; line-height: 1.5; color: var(--text-body); max-width: 860px; }
    .cover-foot { display: flex; justify-content: space-between; align-items: center; border-top: 3px solid var(--border-divider); padding-top: 14px; font-size: 0.95rem; color: var(--text-muted); }
  </style>
</head>
<body>
    <section class="slide-frame">
      <div class="eyebrow">DISCORDIA &nbsp;·&nbsp; ENTREGA DEL CHECKPOINT 3</div>
      <div class="cover-body">
        <h1 class="cover-title">Nuevas funciones<br/>que ya funcionan</h1>
        <p class="cover-sub">38 historias de usuario completadas de punta a punta: administración de servidores, roles y permisos, moderación, mensajería, voz y video, notificaciones, presencia y backoffice.</p>
      </div>
      <div class="cover-foot"><span>Demo y defensa · 2026C2</span><span class="box-tag cyan">CHECKPOINT 3</span></div>
    </section>
</body>
</html>
