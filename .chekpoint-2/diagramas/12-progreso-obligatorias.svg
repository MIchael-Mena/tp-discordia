].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:hsl(40.5882352941, 60%, 83.3333333333%);filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,1,1,-179.624,44.273L0,0Z" fill="#dbeafe" class="pieCircle"/><path d="M-179.624,44.273A185,185,0,0,1,-130.815,-130.815L0,0Z" fill="#ffedd5" class="pieCircle"/><path d="M-130.815,-130.815A185,185,0,0,1,0,-185L0,0Z" fill="#eef2f6" class="pieCircle"/><text transform="translate(90.28994522585805,70.7376546904939)" class="slice" style="text-anchor: middle;">71%</text><text transform="translate(-110.48716088015011,-30.80060519931101)" class="slice" style="text-anchor: middle;">16%</text><text transform="translate(-43.89378969227586,-105.96898237904456)" class="slice" style="text-anchor: middle;">13%</text></g><text x="0" y="-200" class="pieTitleText">104 puntos obligatorios — Checkpoint 2</text><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(219, 234, 254); stroke: rgb(219, 234, 254);"/><text x="22" y="14">Completados de punta a punta [74]</text></g><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(255, 237, 213); stroke: rgb(